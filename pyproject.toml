[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nyaya-marga"
version = "0.1.0"
description = "Intelligent Ingestion Engine for legal document processing"
requires-python = ">=3.10,<3.11"

dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "celery==5.3.4",
    "redis==5.0.1",
    "pymupdf==1.23.8",
    "pdf2image==1.16.3",
    "pytesseract==0.3.10",
    "pillow==10.1.0",
    "transformers==4.35.2",
    "torch==2.1.1",
    "numpy<2",
    "python-dotenv==1.0.0",
    "python-multipart==0.0.6",
]

[project.optional-dependencies]
test = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-benchmark==4.0.0",
    "pytest-cov==4.1.0",
    "pytest-xdist==3.5.0",
    "faker==20.1.0",
    "httpx==0.25.2",
]

[tool.uv]
managed = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests", "app"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]
